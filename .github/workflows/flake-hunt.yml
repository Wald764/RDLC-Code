name: Desktop flake hunt

# Measurement of per-test instability across the Desktop matrix of ci.yml.
# Every suite is repeated `repeat` times with retries disabled; failures are
# recorded, never retried or hidden, and the final report gives each test's
# failure rate per environment. One matrix job runs one Playwright invocation
# (probe, functional or installed journeys), so its 290 minute global timeout
# always leaves the job time to upload.
# Manual runs (workflow_dispatch): test failures never fail a job; harness
# errors, truncated runs and missing results fail the job or the aggregate.
# Called by ci.yml (workflow_call) with `strict: true` as the stability gate for
# changed desktop specs: `specs` restricts the matrix to the changed spec files
# and any test failure, skip outside the documented platform skips, or missing
# or incomplete measurement fails the job and the aggregate.
# See docs/validation/github-actions.md.
on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Repeats of every test (integer from 1 to 10)
        type: number
        default: 5
      groups:
        description: Comma-separated groups to run (core, authoring, context); empty runs all
        type: string
        default: ''
      os:
        description: Comma-separated runners to use (ubuntu-24.04, windows-2022, macos-14); empty runs all
        type: string
        default: ''
      specs:
        description: Comma-separated spec file names to restrict the run to (for example data.spec.ts); empty runs every spec
        type: string
        default: ''
  workflow_call:
    inputs:
      repeat:
        description: Repeats of every test (integer from 1 to 10)
        type: number
        default: 5
      groups:
        description: Comma-separated groups to run (core, authoring, context); empty runs all
        type: string
        default: ''
      os:
        description: Comma-separated runners to use (ubuntu-24.04, windows-2022, macos-14); empty runs all
        type: string
        default: ''
      specs:
        description: Comma-separated spec file names to restrict the run to; empty runs every spec
        type: string
        default: ''
      strict:
        description: Fail on any test failure and on any missing or incomplete measurement
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flake-hunt-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Validate inputs and select the matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      repeat: ${{ steps.plan.outputs.repeat }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .node-version
            package.json
      - run: pnpm install --frozen-lockfile
      - run: node scripts/compile.ts
      # The axes (OS, VS Code version, group, mode) and the spec to group mapping
      # come from scripts/desktop-matrix.ts and tests/desktop/run-tests.ts.
      - id: plan
        env:
          REPEAT: ${{ inputs.repeat }}
          GROUPS_FILTER: ${{ inputs.groups }}
          OS_FILTER: ${{ inputs.os }}
          SPECS: ${{ inputs.specs }}
          # The gate calls with the changed specs; none means nothing to run.
          SPECS_REQUIRED: ${{ inputs.strict && 'true' || 'false' }}
        run: node dist/scripts/desktop-matrix.js plan

  desktop:
    name: Measure ${{ matrix.os }} / ${{ matrix.vscode }} / ${{ matrix.group }} / ${{ matrix.mode }}
    needs: plan
    # No entry (no changed spec, or only visual.spec.ts) skips the matrix.
    if: ${{ needs.plan.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Budget: up to 30 minutes of setup, the 300 minute run step (Playwright
    # global timeout 290 minutes plus 10 minutes for teardown), then at least 20
    # minutes left for the always-run upload. 360 is the hosted maximum.
    timeout-minutes: 350
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
      RDLC_DESKTOP_GROUP: ${{ matrix.group }}
      REPEAT: ${{ needs.plan.outputs.repeat }}
      MODE_ARGS: ${{ matrix.args }}
      # Empty runs the whole group; otherwise only these spec files.
      RDLC_DESKTOP_SPECS: ${{ matrix.specs }}
      # --strict (stability gate) makes the run step fail on any test failure or
      # incomplete measurement. Retries stay 0 either way.
      STRICT_ARGS: ${{ inputs.strict && '--strict' || '' }}
    # Without strict, test failures exit 0 in --measure mode; the run step only
    # fails on a harness error. Every job and the aggregate run regardless
    # (fail-fast: false).
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .node-version
            package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm package
      # The default 1024x768 runner desktop cannot hold the 1440x900 workbench.
      - name: Use a 1920x1080 Windows desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Prepare Linux Desktop observation environment
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace iptables fontconfig fonts-dejavu-core locales
          sudo locale-gen en_US.UTF-8
          # The native observer attaches strace to the running Desktop process tree.
          sudo sysctl -w kernel.yama.ptrace_scope=0
          mkdir -p .vscode-test/desktop-artifacts
          {
            echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
            dpkg-query -W -f='${Package} ${Version}\n' strace iptables fontconfig fonts-dejavu-core locales
            echo "ptrace_scope: $(sysctl -n kernel.yama.ptrace_scope)"
            echo "node: $(node --version)"
          } | tee .vscode-test/desktop-artifacts/linux-environment.txt
      # One Playwright invocation per job. $MODE_ARGS is split on purpose.
      - name: Measure Desktop ${{ matrix.mode }} on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 300
        env:
          TZ: UTC
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          # Plain "[n/m] test" lines (no cursor rewrites) keep the running test
          # readable in the log tail when the runner dies.
          PW_TEST_DEBUG_REPORTERS: '1'
        run: |
          # Diagnostic for "runner lost communication": every 60 s, memory and
          # the largest processes go to a file (uploaded below) and one summary
          # line goes to the log. The logger stops with this step.
          resource_log=.vscode-test/desktop-artifacts/resources.log
          mkdir -p "$(dirname "$resource_log")"
          (
            while true; do
              {
                date -u +%FT%TZ
                free -m
                ps -eo pid,rss,comm --sort=-rss | head -8
              } >> "$resource_log" 2>&1 || true
              summary=$({ free -m | awk '/^Mem:/ {print "used=" $3 "MB available=" $7 "MB"}'; } 2>&1 || true)
              top=$({ ps -eo rss=,comm= --sort=-rss | head -1 | awk '{print $2 " " int($1 / 1024) "MB"}'; } 2>&1 || true)
              echo "resources $(date -u +%T): $summary, top: $top"
              # Background sleep plus wait: killing the subshell leaves no sleep holding stdout.
              sleep 60 > /dev/null 2>&1 &
              wait $! || true
            done
          ) &
          logger=$!
          # bash -e also applies inside the trap: an unguarded failing command (pkill
          # exits 1 when no child is left) would end the trap and replace the exit
          # status of the tests. Every command here is guarded, so the step exits
          # with the status of the test command below.
          stop_logger() {
            pkill -P "$logger" > /dev/null 2>&1 || true
            kill "$logger" > /dev/null 2>&1 || true
            pkill -P "$logger" > /dev/null 2>&1 || true
          }
          trap stop_logger EXIT
          xvfb-run -a -s "-screen 0 1440x1000x24" pnpm test:e2e $MODE_ARGS $STRICT_ARGS --measure --repeat-each="$REPEAT"
      - name: Measure Desktop ${{ matrix.mode }} on Windows and macOS
        if: runner.os != 'Linux'
        timeout-minutes: 300
        shell: bash
        run: pnpm test:e2e $MODE_ARGS $STRICT_ARGS --measure --repeat-each="$REPEAT"
      # Only the JSON results, the runner status and the Linux resource log are kept: traces and
      # screenshots of repeated failures would run to gigabytes.
      - name: Upload Playwright JSON results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flake-results-${{ matrix.os }}-${{ matrix.vscode }}-${{ matrix.group }}-${{ matrix.mode }}
          path: |
            .vscode-test/desktop-artifacts/run-*/playwright-report.json
            .vscode-test/desktop-artifacts/run-*/runner-status.json
            .vscode-test/desktop-artifacts/resources.log
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: Aggregate failure rates
    # Runs after every matrix job, whatever their outcome, unless no entry was planned.
    if: ${{ always() && needs.plan.outputs.count != '0' }}
    needs: [plan, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require the plan
        env:
          PLAN: ${{ needs.plan.result }}
        run: test "$PLAN" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .node-version
            package.json
      - run: pnpm install --frozen-lockfile
      - run: node scripts/compile.ts
      - run: mkdir -p flake-results flake-report
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: flake-results-*
          path: flake-results
      # Test failures are data and do not fail this step, unless strict. An
      # incomplete environment (interrupted or never-run tests) or a missing
      # report always does.
      # The summary is truncated (1 MiB limit); the artifact has everything.
      - name: Write the flake report
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          STRICT_ARGS: ${{ inputs.strict && '--strict' || '' }}
        run: |
          printf '%s' "$MATRIX" > flake-matrix.json
          rc=0
          node dist/scripts/flake-report.js flake-results flake-report --expected flake-matrix.json $STRICT_ARGS || rc=$?
          if [ -f flake-report/flake-summary.md ]; then
            cat flake-report/flake-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
      # Strict (stability gate): every measurement job must have succeeded.
      - name: Require every measurement job in strict mode
        if: ${{ always() && inputs.strict }}
        env:
          DESKTOP: ${{ needs.desktop.result }}
        run: test "$DESKTOP" = success
      - name: Upload the flake report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flake-report
          path: |
            flake-report/flake-report.md
            flake-report/flake-report.json
          if-no-files-found: warn
          retention-days: 30
