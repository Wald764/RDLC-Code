name: Publishing authentication test

on:
  push:
    tags: ['v*-publishing-test']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/tags/v0.0.4-publishing-test'
    runs-on: ubuntu-24.04
    env:
      MARKETPLACE_PUBLISHER: ${{ vars.MARKETPLACE_PUBLISHER }}
      OPENVSX_NAMESPACE: ${{ vars.OPENVSX_NAMESPACE }}
      OPENVSX_AUTH_MODE: ${{ vars.OPENVSX_AUTH_MODE }}
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      archive-digest: ${{ steps.artifact.outputs.artifact-digest }}
      node: ${{ steps.package.outputs.node }}
      vsce: ${{ steps.package.outputs.vsce }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the test tag to point into main history
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .node-version
            package.json
      - run: pnpm install --frozen-lockfile
      - run: node scripts/compile.ts
      - name: Test artifact guards and publisher retry logic
        run: node --test dist/scripts/package-auth-test.test.js dist/scripts/publish-release.test.js dist/tests/release/*.test.js
      - name: Package and verify the approved inert probe once
        id: package
        run: node dist/scripts/package-auth-test.js
      - name: Include the same verifiers as the production handoff
        run: |
          mkdir -p dist/publishing-auth/scripts
          cp dist/scripts/release-artifact.js dist/scripts/validate-release.js \
             dist/scripts/verify-release.js dist/scripts/publish-release.js \
             dist/publishing-auth/scripts/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: artifact
        with:
          name: canonical-${{ github.ref_name }}-${{ github.run_id }}
          path: dist/publishing-auth/*
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  publish:
    needs: package
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    permissions:
      contents: write
      actions: read
      id-token: write
    with:
      artifact-id: ${{ needs.package.outputs.artifact-id }}
      archive-digest: ${{ needs.package.outputs.archive-digest }}
      node: ${{ needs.package.outputs.node }}
      vsce: ${{ needs.package.outputs.vsce }}
