name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0; reads packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .node-version
            package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:roundtrip
      - run: pnpm test:compatibility
      - run: pnpm build

  desktop:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        vscode: ['1.110.0', stable]
    runs-on: ${{ matrix.os }}
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .node-version
            package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm package
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:vscode
      - if: runner.os != 'Linux'
        run: pnpm test:vscode
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:package
      - if: runner.os != 'Linux'
        run: pnpm test:package

  required:
    name: Required checks
    if: always()
    needs: [quality, desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful quality and every desktop matrix entry
        env:
          QUALITY: ${{ needs.quality.result }}
          DESKTOP: ${{ needs.desktop.result }}
        run: test "$QUALITY" = success && test "$DESKTOP" = success
