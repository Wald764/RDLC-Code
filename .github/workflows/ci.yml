name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0; reads packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .node-version
            package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:roundtrip
      - run: pnpm test:compatibility
      - run: pnpm test:acceptance
      - run: pnpm test:release
      - run: pnpm check:commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: pnpm build

  desktop:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        vscode: ['1.142.0', stable]
    runs-on: ${{ matrix.os }}
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .node-version
            package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm package
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:vscode
      - if: runner.os != 'Linux'
        run: pnpm test:vscode
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:package
      - if: runner.os != 'Linux'
        run: pnpm test:package
      - name: Upload VS Code logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vscode-logs-${{ matrix.os }}-${{ matrix.vscode }}
          path: .vscode-test/profile-*/logs/**
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: Required checks
    if: always()
    needs: [quality, desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful quality and every desktop matrix entry
        env:
          QUALITY: ${{ needs.quality.result }}
          DESKTOP: ${{ needs.desktop.result }}
        run: test "$QUALITY" = success && test "$DESKTOP" = success
