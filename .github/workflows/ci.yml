name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0; reads packageManager
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .node-version
            package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:roundtrip
      - run: pnpm test:compatibility
      - run: pnpm test:acceptance
      - run: pnpm test:release
      - run: pnpm check:commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || (github.ref_type != 'tag' && github.event.before) || '' }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: pnpm build

  desktop:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        vscode: ['1.142.0', stable]
        # Disjoint parallel slices of the Desktop journeys (tests/desktop/run-tests.ts).
        group: [core, authoring, context]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
      RDLC_DESKTOP_GROUP: ${{ matrix.group }}
    # After build, package and provisioning every suite runs on its own
    # prerequisites (`!cancelled()`), so one failing suite never hides the
    # others. The step outcomes and the per-test reports are uploaded as
    # evidence; `Required checks` (scripts/qa-gate.ts) decides what blocks.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .node-version
            package.json
      - id: install
        run: pnpm install --frozen-lockfile
      - id: build
        run: pnpm build
      - id: package
        run: pnpm package
      # A transient network failure on the runner (ETIMEDOUT) must not fail a
      # journey: fetch the matrix VS Code here, with retries. The tests reuse
      # the cached install (stable is resolved once here).
      - name: Download VS Code ${{ matrix.vscode }}
        id: download-vscode
        timeout-minutes: 10
        run: node dist/scripts/download-vscode.js
      # The default 1024x768 runner desktop cannot hold the 1440x900 workbench.
      - name: Use a 1920x1080 Windows desktop
        id: display-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      # The default 1024x768 runner display cannot hold the 1440x900 workbench:
      # switch to a larger CoreGraphics mode (no tool to install) and record the
      # modes. macOS windows are clamped to the display work area, so hide the
      # Dock too and the workbench keeps its height.
      - name: Prepare the macOS display
        id: display-macos
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          defaults write com.apple.dock autohide -bool true
          defaults write com.apple.dock autohide-delay -float 1000
          killall Dock || true
          sleep 2
          mkdir -p .vscode-test/desktop-artifacts
          swift scripts/macos-display.swift 2>&1 | tee .vscode-test/desktop-artifacts/macos-display.txt
      # Host suites and the capability probe run once per OS/version, in core.
      - id: vscode-linux
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.group == 'core' && steps.build.outcome == 'success' && steps.download-vscode.outcome == 'success' }}
        run: xvfb-run -a pnpm test:vscode
      - id: vscode-other
        if: ${{ !cancelled() && runner.os != 'Linux' && matrix.group == 'core' && steps.build.outcome == 'success' && steps.download-vscode.outcome == 'success' }}
        run: pnpm test:vscode
      # Diagnostic: the Linux runner has been shut down during test:package.
      - name: Record Linux resources before package tests
        id: resources
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.group == 'core' }}
        run: |
          free -m
          df -h .
          ps -eo pid,rss,etime,args --sort=-rss | head -25
      - id: package-tests-linux
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.group == 'core' && steps.package.outcome == 'success' && steps.download-vscode.outcome == 'success' }}
        run: xvfb-run -a pnpm test:package
      - id: package-tests-other
        if: ${{ !cancelled() && runner.os != 'Linux' && matrix.group == 'core' && steps.package.outcome == 'success' && steps.download-vscode.outcome == 'success' }}
        run: pnpm test:package
      - name: Prepare Linux Desktop observation environment
        id: prepare-linux
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace iptables fontconfig fonts-dejavu-core locales
          sudo locale-gen en_US.UTF-8
          # The native observer attaches strace to the running Desktop process tree.
          sudo sysctl -w kernel.yama.ptrace_scope=0
          # Host blocking rejects traffic of this cgroup v2 only (the Desktop is
          # launched into it), never of the runner uid: the runner agent shares
          # that uid and must keep its connection to GitHub.
          test -f /sys/fs/cgroup/cgroup.controllers || { echo 'cgroup v2 is required for host blocking'; exit 1; }
          sudo mkdir -p /sys/fs/cgroup/rdlc-desktop
          cgroup_help="$(iptables -m cgroup -h 2>&1 || true)"
          grep -qe '--path' <<<"$cgroup_help" || { echo 'iptables lacks the cgroup --path match'; exit 1; }
          mkdir -p .vscode-test/desktop-artifacts
          {
            echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
            dpkg-query -W -f='${Package} ${Version}\n' strace iptables fontconfig fonts-dejavu-core locales
            echo "ptrace_scope: $(sysctl -n kernel.yama.ptrace_scope)"
            echo "cgroup: $(stat -f -c %T /sys/fs/cgroup) $(ls -d /sys/fs/cgroup/rdlc-desktop)"
            echo "kernel: $(uname -r)"
            iptables --version
            echo "node: $(node --version)"
          } | tee .vscode-test/desktop-artifacts/linux-environment.txt
      # One prerequisite for the Desktop journeys: the OS-specific display or
      # observation environment is ready.
      - name: Desktop environment is ready
        id: environment
        if: ${{ !cancelled() && (steps.prepare-linux.outcome == 'success' || steps.display-windows.outcome == 'success' || steps.display-macos.outcome == 'success') }}
        run: echo "Desktop environment ready on $RUNNER_OS"
      - name: Probe installed Desktop capabilities on Linux
        id: probe-linux
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.group == 'core' && steps.package.outcome == 'success' && steps.download-vscode.outcome == 'success' && steps.environment.outcome == 'success' }}
        env:
          TZ: UTC
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: xvfb-run -a -s "-screen 0 1440x1000x24" pnpm test:e2e --probe --packaged
      - name: Probe installed Desktop capabilities on Windows and macOS
        id: probe-other
        if: ${{ !cancelled() && runner.os != 'Linux' && matrix.group == 'core' && steps.package.outcome == 'success' && steps.download-vscode.outcome == 'success' && steps.environment.outcome == 'success' }}
        run: pnpm test:e2e --probe --packaged
      - name: Run Desktop functional journeys on Linux
        id: e2e-linux
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build.outcome == 'success' && steps.download-vscode.outcome == 'success' && steps.environment.outcome == 'success' }}
        env:
          TZ: UTC
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: xvfb-run -a -s "-screen 0 1440x1000x24" pnpm test:e2e
      - name: Run Desktop functional journeys on Windows and macOS
        id: e2e-other
        if: ${{ !cancelled() && runner.os != 'Linux' && steps.build.outcome == 'success' && steps.download-vscode.outcome == 'success' && steps.environment.outcome == 'success' }}
        run: pnpm test:e2e
      - name: Run installed Desktop journeys on Linux
        id: installed-linux
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.package.outcome == 'success' && steps.download-vscode.outcome == 'success' && steps.environment.outcome == 'success' }}
        env:
          TZ: UTC
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: xvfb-run -a -s "-screen 0 1440x1000x24" pnpm test:e2e --packaged
      - name: Run installed Desktop journeys on Windows and macOS
        id: installed-other
        if: ${{ !cancelled() && runner.os != 'Linux' && steps.package.outcome == 'success' && steps.download-vscode.outcome == 'success' && steps.environment.outcome == 'success' }}
        run: pnpm test:e2e --packaged
      # Step outcomes and per-test reports for the required gate. Read from
      # source: it must work when the build itself failed.
      - name: Collect QA evidence for this matrix cell
        if: always()
        shell: bash
        env:
          QA_KIND: desktop
          QA_CANDIDATE: ${{ github.sha }}
          QA_OS: ${{ matrix.os }}
          QA_VSCODE: ${{ matrix.vscode }}
          QA_GROUP: ${{ matrix.group }}
          QA_STEP_INSTALL: ${{ steps.install.outcome }}
          QA_STEP_BUILD: ${{ steps.build.outcome }}
          QA_STEP_PACKAGE: ${{ steps.package.outcome }}
          QA_STEP_DOWNLOAD_VSCODE: ${{ steps.download-vscode.outcome }}
          QA_STEP_DISPLAY_WINDOWS: ${{ steps.display-windows.outcome }}
          QA_STEP_DISPLAY_MACOS: ${{ steps.display-macos.outcome }}
          QA_STEP_VSCODE_LINUX: ${{ steps.vscode-linux.outcome }}
          QA_STEP_VSCODE_OTHER: ${{ steps.vscode-other.outcome }}
          QA_STEP_RESOURCES: ${{ steps.resources.outcome }}
          QA_STEP_PACKAGE_TESTS_LINUX: ${{ steps.package-tests-linux.outcome }}
          QA_STEP_PACKAGE_TESTS_OTHER: ${{ steps.package-tests-other.outcome }}
          QA_STEP_PREPARE_LINUX: ${{ steps.prepare-linux.outcome }}
          QA_STEP_PROBE_LINUX: ${{ steps.probe-linux.outcome }}
          QA_STEP_PROBE_OTHER: ${{ steps.probe-other.outcome }}
          QA_STEP_E2E_LINUX: ${{ steps.e2e-linux.outcome }}
          QA_STEP_E2E_OTHER: ${{ steps.e2e-other.outcome }}
          QA_STEP_INSTALLED_LINUX: ${{ steps.installed-linux.outcome }}
          QA_STEP_INSTALLED_OTHER: ${{ steps.installed-other.outcome }}
        run: node scripts/qa-collect.ts
      - name: Upload QA evidence for this matrix cell
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-cell-${{ matrix.os }}-${{ matrix.vscode }}-${{ matrix.group }}
          path: qa-evidence/**
          if-no-files-found: error
          # A re-run of the cell supersedes the evidence of the previous attempt.
          overwrite: true
          retention-days: 30
      # Passing tests leave no trace behind (preserveOutput: 'failures-only'), so
      # the evidence holds the traces of failing tests only.
      - name: Upload Desktop run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-probe-${{ matrix.os }}-${{ matrix.vscode }}-${{ matrix.group }}
          path: .vscode-test/desktop-artifacts/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload VS Code logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vscode-logs-${{ matrix.os }}-${{ matrix.vscode }}-${{ matrix.group }}
          path: .vscode-test/profile-*/logs/**
          if-no-files-found: ignore
          retention-days: 7

  # Stability gate: added or modified tests/desktop/*.spec.ts files are repeated
  # 5 times, with retries disabled, on the whole Desktop matrix of their groups.
  # Critical: if the detection fails, the stability evidence is missing and the
  # required gate blocks. The measurements are judged per test by the gate.
  changed-specs:
    name: Detect changed Desktop specs
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      specs: ${{ steps.changed.outputs.specs }}
    steps:
      # The three-dot diff needs the merge base: full history.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .node-version
            package.json
      - run: pnpm install --frozen-lockfile
      - run: node scripts/compile.ts
      # Empty outside pull requests (push to main, release calls): nothing to gate.
      - id: changed
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
        run: node dist/scripts/desktop-matrix.js changed

  stability:
    name: Stability gate for changed Desktop specs
    needs: changed-specs
    # Always runs, so the required check always has a status. With no changed spec
    # the called workflow plans an empty matrix and skips every measurement job.
    uses: ./.github/workflows/flake-hunt.yml
    with:
      repeat: 5
      specs: ${{ needs.changed-specs.outputs.specs }}
      strict: true

  # Informational: rendering differences have no data or security impact. Its
  # per-test report is still classified by the required gate, so a critical
  # test failing here would block.
  visual:
    name: Pinned visual references
    needs: quality
    runs-on: ubuntu-24.04
    env:
      VSCODE_VERSION: '1.142.0'
      TZ: UTC
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .node-version
            package.json
      - id: install
        run: pnpm install --frozen-lockfile
      - id: build
        run: pnpm build
      - name: Provision and record the reference candidate environment
        id: provision
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core locales
          sudo locale-gen en_US.UTF-8
          mkdir -p .vscode-test/desktop-artifacts
          {
            echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
            dpkg-query -W -f='${Package} ${Version}\n' fontconfig fonts-dejavu-core locales
            echo "vscode: ${VSCODE_VERSION}"
            echo "display: 1440x1000 dpr=1"
            echo "locale: ${LANG} timezone: ${TZ}"
          } | tee .vscode-test/desktop-artifacts/reference-environment.txt
      # Missing references or a reference-environment mismatch fail this step;
      # CI never refreshes or skips a required comparison.
      - name: Run fixed-environment visual comparisons
        id: visual
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.provision.outcome == 'success' }}
        run: xvfb-run -a -s "-screen 0 1440x1000x24" pnpm test:visual
      - name: Collect QA evidence for the visual job
        if: always()
        shell: bash
        env:
          QA_KIND: visual
          QA_CANDIDATE: ${{ github.sha }}
          QA_OS: ubuntu-24.04
          QA_VSCODE: '1.142.0'
          QA_STEP_INSTALL: ${{ steps.install.outcome }}
          QA_STEP_BUILD: ${{ steps.build.outcome }}
          QA_STEP_PROVISION: ${{ steps.provision.outcome }}
          QA_STEP_VISUAL: ${{ steps.visual.outcome }}
        run: node scripts/qa-collect.ts
      - name: Upload QA evidence for the visual job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-cell-visual
          path: qa-evidence/**
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Upload visual evidence on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-evidence-${{ github.run_id }}
          path: .vscode-test/desktop-artifacts/**
          if-no-files-found: ignore
          retention-days: 7

  # The only required status check. It never rewrites a failed job: the jobs
  # above keep their own results, this gate classifies the uploaded evidence
  # (tests/desktop/qa-classification.ts, scripts/qa-gate.ts). Critical failures
  # and missing critical evidence block; informational failures are listed.
  required:
    name: Required checks
    if: always()
    needs: [quality, desktop, visual, changed-specs, stability]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .node-version
            package.json
      - run: pnpm install --frozen-lockfile
      - run: node scripts/compile.ts
      # No cell evidence at all (for example quality failed and every cell was
      # skipped) is a gate failure below, not a download failure.
      - name: Download the QA evidence of every cell
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: qa-cell-*
          path: qa-evidence
      # Per-test flake-hunt results of the changed-spec stability gate. The gate
      # classifies them test by test; none at all is fine only when no Desktop
      # spec changed (the changed-specs output), otherwise a failed stability
      # job without per-test evidence blocks.
      - name: Download the stability measurements
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: flake-results-*
          path: qa-stability
      - name: Evaluate the QA gate
        env:
          QA_NEEDS: ${{ toJSON(needs) }}
          QA_CANDIDATE: ${{ github.sha }}
        run: node dist/scripts/qa-gate.js pr --candidate "$QA_CANDIDATE" --evidence qa-evidence --stability qa-stability --out qa-summary.json
      - name: Upload the QA summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-summary-${{ github.sha }}
          path: qa-summary.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
