name: Release candidate

on:
  push:
    tags: ['v*.*.*', '!v*-publishing-test']

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}
  MARKETPLACE_PUBLISHER: ${{ vars.MARKETPLACE_PUBLISHER }}
  OPENVSX_NAMESPACE: ${{ vars.OPENVSX_NAMESPACE }}
  OPENVSX_AUTH_MODE: ${{ vars.OPENVSX_AUTH_MODE }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Validate detached tag, reviewed ancestry and mandatory candidate evidence
        run: node scripts/validate-release.ts "$RELEASE_TAG" origin/main

  quality:
    needs: validation
    uses: ./.github/workflows/ci.yml

  canonical:
    needs: [validation, quality]
    runs-on: ubuntu-24.04
    env:
      RELEASE_VALIDATION_RESULT: ${{ needs.validation.result }}
      RELEASE_QUALITY_RESULT: ${{ needs.quality.result }}
      # Every applicable check certifies the same minimum binary the pinned
      # visual reference is recorded against.
      VSCODE_VERSION: '1.142.0'
      TZ: UTC
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .node-version
            package.json
      - run: node scripts/validate-release.ts "$RELEASE_TAG" origin/main
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm package
      - run: xvfb-run -a pnpm test:package
      - name: Provision and record the candidate observation environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace iptables fontconfig fonts-dejavu-core locales
          sudo locale-gen en_US.UTF-8
          # The native observer attaches strace to the running Desktop process tree.
          sudo sysctl -w kernel.yama.ptrace_scope=0
          mkdir -p .vscode-test/desktop-artifacts
          {
            echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
            dpkg-query -W -f='${Package} ${Version}\n' strace iptables fontconfig fonts-dejavu-core locales
            echo "ptrace_scope: $(sysctl -n kernel.yama.ptrace_scope)"
            echo "node: $(node --version)"
            echo "vscode: ${VSCODE_VERSION}"
            echo "display: 1440x1000 dpr=1"
            echo "locale: ${LANG} timezone: ${TZ}"
          } | tee .vscode-test/desktop-artifacts/linux-environment.txt
      # Applicable installed, security and visual checks below install the exact
      # bytes built in this job; they certify nothing but those bytes.
      - name: Certify the canonical bytes with installed Desktop journeys
        run: xvfb-run -a -s "-screen 0 1440x1000x24" pnpm test:e2e --packaged
      - name: Certify the canonical bytes with security observation
        run: xvfb-run -a -s "-screen 0 1440x1000x24" pnpm test:e2e --probe --packaged
      - name: Certify the canonical bytes against the pinned visual references
        run: xvfb-run -a -s "-screen 0 1440x1000x24" pnpm test:visual --packaged
      - name: Bind the canonical bytes to source, gates and accepted evidence
        run: node dist/scripts/release-artifact.js
      - name: Include the publishers' verifiers in the handoff
        run: |
          mkdir -p dist/canonical/scripts
          cp dist/scripts/release-artifact.js dist/scripts/validate-release.js \
             dist/scripts/verify-release.js dist/scripts/publish-release.js \
             dist/canonical/scripts/
      - name: Read the manifest identity for downstream jobs
        id: manifest
        run: node dist/scripts/publish-release.js manifest --dir dist/canonical
      - name: Upload verified canonical VSIX and immutable manifest
        id: canonical
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-${{ github.ref_name }}-${{ github.run_id }}
          path: dist/canonical/*
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      # Separate from the canonical handoff: diagnostics upload on every
      # outcome and never carry release bytes.
      - name: Upload Desktop diagnostics for this run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-diagnostics-${{ github.ref_name }}-${{ github.run_id }}
          path: .vscode-test/desktop-artifacts/**
          if-no-files-found: ignore
          retention-days: 7
    outputs:
      artifact-id: ${{ steps.canonical.outputs.artifact-id }}
      archive-digest: ${{ steps.canonical.outputs.artifact-digest }}
      node: ${{ steps.manifest.outputs.node }}
      vsce: ${{ steps.manifest.outputs.vsce }}

  publish:
    needs: canonical
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    permissions:
      contents: write
      actions: read
      id-token: write
    with:
      artifact-id: ${{ needs.canonical.outputs.artifact-id }}
      archive-digest: ${{ needs.canonical.outputs.archive-digest }}
      node: ${{ needs.canonical.outputs.node }}
      vsce: ${{ needs.canonical.outputs.vsce }}
